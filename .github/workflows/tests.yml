name: Synthetic tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,preparation,scoring]'
      - run: python -m pytest -q
      - name: Rebuild report figures from published outputs
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/build_research_report_figures.py
          python scripts/build_cnn_report_figures.py
