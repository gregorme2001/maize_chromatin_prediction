[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maize-chromatin-prediction"
version = "0.1.0"
description = "Prediction of maize cortex chromatin accessibility from local DNA sequence"
authors = [{name = "Gregory Orme"}]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "pyarrow>=12",
  "matplotlib>=3.7",
  "ipykernel>=6",
]

[project.urls]
Repository = "https://github.com/gregorme2001/maize_chromatin_prediction"

[project.optional-dependencies]
preparation = ["gdown>=5", "openpyxl>=3.1"]
scoring = ["biopython>=1.81", "numba>=0.59", "pyfaidx>=0.8"]
neural = ["torch>=2.5"]
dev = ["pytest>=7", "ruff>=0.6", "nbformat>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maize_regulatory = ["resources/*.txt", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
